# XcodeGen 工程描述文件
#
# 为什么用 XcodeGen：本项目在 Windows 上开发，没有 Xcode 可以手点「新建工程」。
# project.yml 是纯文本，用它描述工程结构，再由 macOS runner 上的
# `xcodegen generate` 现场生成 .xcodeproj —— 这样仓库里不需要提交
# 那种几百行的二进制工程文件，改起来也清爽。
#
# 本地/CI 用法：xcodegen generate

name: TingShu

options:
  bundleIdPrefix: com.paiwo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # 只做 iPhone 竖屏，不要 iPad / Mac
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_BITCODE: NO
    # 关闭脚本沙箱，避免 Xcode 15+ 在 CI 上因权限报错
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TingShu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: TingShu
        excludes:
          - "Info.plist"        # 不要让 plist 被当成资源复制进 bundle

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paiwo.tingshu
        PRODUCT_NAME: TingShu
        INFOPLIST_FILE: TingShu/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 无签名构建：Sideloadly 会在安装时用自己的证书重签
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  TingShu:
    build:
      targets:
        TingShu: all
    run:
      config: Debug
    archive:
      config: Release
