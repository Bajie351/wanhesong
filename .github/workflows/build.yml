name: Build IPA

# 在 GitHub 的 macOS 机器上编译，产出未签名的 ipa。
# 未签名 ipa 不能直接装，需要用 Sideloadly 用自己的 Apple ID 重签后再装。
#
# 触发方式：
#   · 往 main 分支 push
#   · 或者在 Actions 页面点 "Run workflow"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# gh release create 要往仓库写东西。默认 GITHUB_TOKEN 可能是只读，
# 少了这一句 Release 那一步会直接失败（编译本身不受影响）。
permissions:
  contents: write

jobs:
  build:
    # 用 macos-latest 而不是写死 macos-14：GitHub 会定期淘汰老 runner 镜像，
    # 写死的版本一旦退役，整条流水线会直接报「no runner matching」。
    # latest 永远指向当前可用的最新稳定 macOS 镜像。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 显示编译环境
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project TingShu.xcodeproj \
            -scheme TingShu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: 校验产物
        run: |
          APP="build/Build/Products/Release-iphoneos/TingShu.app"
          test -d "$APP" || { echo "没有产出 .app"; exit 1; }
          echo "=== Bundle 内容 ==="
          ls -la "$APP"
          echo "=== 二进制架构 ==="
          lipo -info "$APP/TingShu" || true
          echo "=== Info.plist 关键字段 ==="
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"

      - name: 打包成 ipa
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TingShu.app Payload/
          # -y 保留符号链接
          zip -qry TingShu.ipa Payload
          rm -rf Payload
          ls -lh TingShu.ipa
          shasum -a 256 TingShu.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: TingShu-ipa
          path: TingShu.ipa
          retention-days: 90
          if-no-files-found: error

      # artifact 必须登录 GitHub 才能下载，开发机上没装 gh 就取不到。
      # 挂一个固定 tag 的 Release：public 仓库的 release asset 可以匿名直链下载，
      # 以后每次编译都覆盖同一个 tag，地址永远不变。
      - name: 发布成 Release（免登录直链）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "=== 覆盖 latest-ipa 这个 tag ==="
          gh release delete latest-ipa --yes --cleanup-tag 2>/dev/null || echo "还没有旧 release，跳过"
          gh release create latest-ipa TingShu.ipa \
            --title "听书 ipa（未签名，当前最新）" \
            --notes "自动编译产物，每次 push 覆盖。commit: $(git rev-parse --short HEAD)"
          echo "=== 直链 ==="
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-ipa/TingShu.ipa"
